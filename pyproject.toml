[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppa-pricing-engine"
version = "0.1.0"
description = "Pay-as-Produced PPA Pricing and Risk Tool for German Solar & Wind Farms"
authors = [
    { name = "Energy Quant Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.31.0",
    "openmeteo-requests>=1.2.0",
    "requests-cache>=1.2.0",
    "retry-requests>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "scipy>=1.13.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]

[project.scripts]
ppa-tool = "main:main"

[tool.setuptools.packages.find]
include = ["ppa_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

